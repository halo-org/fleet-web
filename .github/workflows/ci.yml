name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: |
          mkdir -p -m 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/halo-builder <<< "$HALO_BUILDER_SSH_KEY"
          echo 'halo-builder.fly.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+rL+Mybp7iCMdWGHZHBFTwmsmUaahwa8VLEjkFsjX6' >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host halo-builder.fly.dev
            IdentityFile ~/.ssh/halo-builder
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
        env:
          HALO_BUILDER_SSH_KEY: ${{ secrets.HALO_BUILDER_SSH_KEY }}
      # flake check skips derivations that are missing from the build store
      - run: |
          set -o pipefail
          nix eval --json .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: c: c.drvPath)' | jq -r '.[]' | nix copy --stdin --to ssh-ng://ci@halo-builder.fly.dev
      - run: nix flake check -L --keep-going --eval-store auto --store ssh-ng://ci@halo-builder.fly.dev

  publish:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: |
          mkdir -p -m 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/halo-builder <<< "$HALO_BUILDER_SSH_KEY"
          echo 'halo-builder.fly.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+rL+Mybp7iCMdWGHZHBFTwmsmUaahwa8VLEjkFsjX6' >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host halo-builder.fly.dev
            IdentityFile ~/.ssh/halo-builder
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
        env:
          HALO_BUILDER_SSH_KEY: ${{ secrets.HALO_BUILDER_SSH_KEY }}
      - run: |
          publish=$(nix build -L --no-link --print-out-paths --eval-store auto --store ssh-ng://ci@halo-builder.fly.dev .#publish)
          nix copy --no-check-sigs --from ssh-ng://ci@halo-builder.fly.dev "$publish"
      - run: |
          set -o pipefail
          nix eval --json .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: c: c.drvPath)' | jq -r '.[]' > "$RUNNER_TEMP/pins"
          nix path-info --derivation .#publish >> "$RUNNER_TEMP/pins"
          ssh ci@halo-builder.fly.dev pin fleet-web < "$RUNNER_TEMP/pins"
      - run: nix run -L .#publish -- "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
