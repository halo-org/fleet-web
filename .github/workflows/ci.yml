name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            extra-substituters = https://halo-cache.fly.dev/halo
            extra-trusted-public-keys = halo:nXtBRLJRHoAQ/CoFmYkvJAiFzHJLTmqygmvhGNryigA=
      - run: |
          nix profile install --inputs-from . nixpkgs#attic-client
          attic login halo-cache https://halo-cache.fly.dev "$ATTIC_TOKEN"
          attic watch-store halo-cache:halo &> /dev/null &
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - run: nix flake check -L --keep-going
      - if: ${{ !cancelled() }}
        run: nix path-info --all | grep -v '\.drv$' | attic push --stdin halo-cache:halo

  publish:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            extra-substituters = https://halo-cache.fly.dev/halo
            extra-trusted-public-keys = halo:nXtBRLJRHoAQ/CoFmYkvJAiFzHJLTmqygmvhGNryigA=
      - run: |
          nix profile install --inputs-from . nixpkgs#attic-client
          attic login halo-cache https://halo-cache.fly.dev "$ATTIC_TOKEN"
          attic watch-store halo-cache:halo &> /dev/null &
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - run: nix run -L .#publish -- "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
      - if: ${{ !cancelled() }}
        run: nix path-info --all | grep -v '\.drv$' | attic push --stdin halo-cache:halo
