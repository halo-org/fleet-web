name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    uses: halo-org/ci/.github/workflows/ci.yml@main
    with:
      builders: ${{ vars.NIX_BUILDERS }}
    secrets:
      builder-ssh-key: ${{ secrets.NIX_BUILDER_SSH_KEY }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: |
          mkdir -p -m 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/halo-builder <<< "$NIX_BUILDER_SSH_KEY"
          echo 'halo-builder.fly.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+rL+Mybp7iCMdWGHZHBFTwmsmUaahwa8VLEjkFsjX6' >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host halo-builder.fly.dev
            IdentityFile ~/.ssh/halo-builder
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
        env:
          NIX_BUILDER_SSH_KEY: ${{ secrets.NIX_BUILDER_SSH_KEY }}
      - run: |
          publish=$(nix build -L --no-link --print-out-paths --eval-store auto --store ssh-ng://ci@halo-builder.fly.dev .#publish)
          nix copy --no-check-sigs --from ssh-ng://ci@halo-builder.fly.dev "$publish"
      - run: nix run -L .#publish -- "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
