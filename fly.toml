# Run from this directory: flyctl deploy --ha=false
app = "jc-fleet-web"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = 5

[env]
  FLEET_API_URL = "https://jc-fleet.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
